<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>כניסה</title>
<style>
:root{--bg:#F2F3F1;--card:#fff;--ink:#1B2421;--muted:#56615D;--line:#D5DAD7;--acc:#1E5C55;--bad:#A3361F}
@media (prefers-color-scheme:dark){:root{--bg:#141A18;--card:#1C2421;--ink:#E7ECE9;--muted:#A3AEA9;--line:#33403B;--acc:#7CC4B8;--bad:#F08A72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,Arial,sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);direction:ltr}
label.r{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:600 16px/1 inherit;padding:12px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);min-height:1.5em}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

var KIND = "html";
var K = "review-site-key-" + SITE.salt;
function bytes(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function str(a){var s="";for(var i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)}
function get(st){try{return st.getItem(K)}catch(e){return null}}
function put(st,v){try{st.setItem(K,v)}catch(e){}}
function drop(){try{sessionStorage.removeItem(K);localStorage.removeItem(K)}catch(e){}}
async function keyFrom(raw){return crypto.subtle.importKey("raw",bytes(raw),"AES-GCM",false,["decrypt"])}
async function open(key){
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(PAGE.iv)},key,bytes(PAGE.ct));
  if(KIND==="pdf"){
    var url=URL.createObjectURL(new Blob([pt],{type:"application/pdf"}));
    location.replace(url);
    return;
  }
  var html=new TextDecoder().decode(pt);
  // writing while this page is still being read is silently ignored: wait until it has loaded
  if(document.readyState!=="complete")await new Promise(function(r){addEventListener("load",r,{once:true})});
  var t=/<title>([^<]*)<\/title>/i.exec(html);
  document.open();document.write(html);document.close();
  if(t)document.title=t[1];
}
async function tryStored(){
  var raw=get(sessionStorage)||get(localStorage);
  if(!raw)return false;
  try{await open(await keyFrom(raw));return true}catch(e){drop();return false}
}
async function login(ev){
  ev.preventDefault();
  var go=document.getElementById("go"),err=document.getElementById("err");
  go.disabled=true;err.textContent="";
  try{
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveBits"]);
    var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:bytes(SITE.salt),iterations:SITE.it,hash:"SHA-256"},base,256));
    var raw=str(bits);
    var key=await keyFrom(raw);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(PAGE.iv)},key,bytes(PAGE.ct));
    put(sessionStorage,raw);
    if(document.getElementById("keep").checked)put(localStorage,raw);
    await open(key);
  }catch(e){
    err.textContent="הסיסמה לא נכונה. Wrong password.";
    go.disabled=false;
  }
}
document.getElementById("f").addEventListener("submit",login);
tryStored().then(function(ok){if(!ok){var f=document.getElementById("f");f.hidden=false;document.getElementById("pw").focus()}});
</script>
